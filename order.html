<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Order • LIVE STOCK</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span>LIVE STOCK</span></div>
      <div class="nav">
        <a class="pill" href="index.html">Our Products</a>
        <a class="pill active" href="orders.html">Orders</a>
        <a class="pill" href="https://t.me/T_T_C_c_C" target="_blank" rel="noopener">Support</a>
        <a class="pill" href="admin.html">Admin</a>
      </div>
    </div>

    <div class="panel" style="margin-top:18px">
      <div class="title" style="font-size:22px">Order Details</div>
      <p class="sub">الأكواد تظهر هنا بعد Approve.</p>

      <div id="box" class="notice"></div>

      <div class="panel" style="margin-top:14px">
        <div class="small">Codes</div>
        <pre id="codes" class="kbd" style="white-space:pre-wrap;margin:10px 0 0;color:var(--txt)"></pre>
      </div>
    </div>

    <div class="footer">إذا عندك مشكلة، تواصل معنا: <a href="https://t.me/T_T_C_c_C" target="_blank" rel="noopener">@T_T_C_c_C</a></div>
  </div>

  <script src="app.js"></script>
  <script>
    LS_API.init();
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const orders = LS_API.load(LS_API.LS.orders, []);
    const o = orders.find(x=>x.id===id);
    const el = document.getElementById("box");
    const codes = document.getElementById("codes");

    if(!o){
      el.textContent = "Order not found.";
    }else{
      el.innerHTML = `
        <div class="miniRow"><div><b>Order ID:</b> <span class="kbd">${o.id}</span></div><div><b>Status:</b> ${o.status}</div></div>
        <div class="miniRow"><div><b>Product:</b> ${o.productName}</div><div><b>Qty:</b> ${o.qty}</div></div>
        <div class="miniRow"><div><b>Total:</b> $${o.totalUSD}</div><div><b>Payment:</b> ${o.paymentName}</div></div>
        <div style="margin-top:8px"><b>Address:</b> <span class="kbd">${o.address}</span></div>
        <div style="margin-top:6px"><b>TxID:</b> <span class="kbd">${o.txid || "—"}</span></div>
        <div style="margin-top:6px"><b>Created:</b> ${new Date(o.createdAt).toLocaleString()}</div>
      `;
      if(o.status === "APPROVED" && o.codes && o.codes.length){
        codes.textContent = o.codes.join("\n");
      }else{
        codes.textContent = "Waiting for approval…";
      }
    }
  </script>
</body>
</html>
