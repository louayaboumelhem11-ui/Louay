<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Orders • LIVE STOCK</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span>LIVE STOCK</span></div>
      <div class="nav">
        <a class="pill" href="index.html">Our Products</a>
        <a class="pill active" href="orders.html">Orders</a>
        <a class="pill" href="https://t.me/T_T_C_c_C" target="_blank" rel="noopener">Support</a>
        <a class="pill" href="admin.html">Admin</a>
      </div>
    </div>

    <div class="panel" style="margin-top:18px">
      <div class="title" style="font-size:22px">My Orders</div>
      <div class="sub">الطلبات المحفوظة على نفس الجهاز + إمكانية البحث بـ Order ID</div>

      <div class="form" style="margin-top:14px">
        <div class="full">
          <div class="small">Search by Order ID</div>
          <div class="miniRow">
            <input class="input kbd" id="q" placeholder="LS-...."/>
            <button class="copy" id="go">Open</button>
          </div>
        </div>
      </div>

      <table class="table" id="t">
        <thead><tr><th>Order ID</th><th>Status</th><th>Product</th><th>Qty</th><th>Total</th><th>Date</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="footer">Tip: افتح الطلب لرؤية الأكواد بعد Approve.</div>
  </div>

  <div class="fab">
    <a class="tg" href="https://t.me/T_T_C_c_C" target="_blank" rel="noopener">Need Assistance? <span class="kbd">@T_T_C_c_C</span></a>
  </div>

  <script src="app.js"></script>
  <script>
    LS_API.init();
    const orders = LS_API.load(LS_API.LS.orders, []);
    const my = LS_API.load(LS_API.LS.myOrders, []);
    const tbody = document.querySelector("#t tbody");

    function row(o){
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="kbd"><a href="order.html?id=${encodeURIComponent(o.id)}">${o.id}</a></td>
        <td><b>${o.status}</b></td>
        <td>${o.productName}</td>
        <td>${o.qty}</td>
        <td>$${o.totalUSD}</td>
        <td class="small">${new Date(o.createdAt).toLocaleString()}</td>
      `;
      return tr;
    }

    my.forEach(id=>{
      const o = orders.find(x=>x.id===id);
      if(o) tbody.appendChild(row(o));
    });

    document.getElementById("go").addEventListener("click", ()=>{
      const id = (document.getElementById("q").value||"").trim();
      if(!id) return;
      window.location.href = "order.html?id=" + encodeURIComponent(id);
    });
  </script>
</body>
</html>
